<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0b" />
  <title>INSOMNIATOOLS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>

  <section class="hero">
    <div class="hero-tag">
      <span class="hero-tag-dot"></span>
      <span id="toolCount">0</span> tools siap pakai
    </div>
    <h1 class="title">INSOMNIA<span class="accent">TOOLS</span></h1>
    <p class="subtitle">Semua kebutuhan, satu tempat.</p>
  </section>

  <div class="search-wrap">
    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" class="search-input" id="searchInput" placeholder="Cari tool..." autocomplete="off" />
    </div>
  </div>

  <div class="chips" id="chipsWrap"></div>
  <div class="grid-wrap" id="gridWrap"></div>

  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <div class="modal-head">
        <div style="min-width:0;flex:1;">
          <div class="modal-cat" id="modalCat">—</div>
          <div class="modal-title" id="modalTitle">Tool</div>
          <div class="modal-sub" id="modalSub"></div>
        </div>
        <button class="modal-close" id="modalClose" aria-label="Close">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <form id="modalForm"></form>
      </div>
    </div>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="/assets/tools.js"></script>
  <script>document.getElementById('toolCount').textContent = window.TOOLS.length;</script>
  <script src="/assets/app.js"></script>
  <script src="/assets/nav.js"></script>
</body>
</html>
