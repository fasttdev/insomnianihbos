<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0b" />
  <title>INSOMNIATOOLS — Tools</title>
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>

  <section class="hero">
    <div class="badge">
      <span class="badge-dot"></span>
      <span id="toolCount">162</span> tools aktif
    </div>
    <h1 class="title">INSOMNIATOOLS</h1>
    <p class="subtitle">Kumpulan tools VamxAPI. Cari, klik, eksekusi.</p>
  </section>

  <div class="search-wrap">
    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" class="search-input" id="searchInput" placeholder="Cari tool..." autocomplete="off" />
    </div>
  </div>

  <div class="chips" id="chipsWrap"></div>

  <div class="grid-wrap" id="gridWrap"></div>

  <!-- Modal -->
  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <div class="modal-head">
        <div>
          <div class="modal-meta">
            <span class="tag GET" id="modalMethod">GET</span>
            <span id="modalPath" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px;display:inline-block;">/</span>
          </div>
          <div class="modal-title" id="modalTitle">Tool</div>
          <div class="modal-sub" id="modalSub"></div>
        </div>
        <button class="modal-close" id="modalClose" aria-label="Close">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <form id="modalForm"></form>
      </div>
    </div>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="/assets/tools.js"></script>
  <script>
    document.getElementById('toolCount').textContent = window.TOOLS.length;
  </script>
  <script src="/assets/app.js"></script>
  <script src="/assets/nav.js"></script>
</body>
</html>
